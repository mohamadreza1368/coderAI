version: '3.8'

services:
  coderai:
    build: .
    container_name: coderai_app
    ports:
      - "7864:7864"
    volumes:
      - .:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - WEB_APP_HOST=0.0.0.0
      - WEB_APP_PORT=7864
      # Two independent guards. (1) The server refuses non-loopback clients by
      # default; inside the container the browser's request arrives from
      # Docker's NAT gateway (a non-loopback IP), so disable the loopback-only
      # guard. (2) An access token then gates that non-loopback access — set a
      # fixed value here (any string) and put it in the browser (Settings →
      # Remote access, or open the page as http://localhost:7864/?token=SECRET).
      # Loopback clients never need it; without a token, non-loopback requests
      # are refused.
      - WEB_APP_LOOPBACK_ONLY=false
      - CODERAI_DISABLE_AUTH=true
      - CODERAI_AUTH_TOKEN=change-me-please
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_URL=http://host.docker.internal:11434/api/generate
      
      # Uncomment and set your proxy if you are in a restricted region and want to use external Custom APIs (like OpenAI, Nvidia, etc.)
      # - HTTP_PROXY=http://host.docker.internal:10808
      # - HTTPS_PROXY=http://host.docker.internal:10808
      
      # Add your API keys here if you want them to be available to the agent
      # - OPENAI_API_KEY=your_key
      # - ANTHROPIC_API_KEY=your_key
    restart: unless-stopped
